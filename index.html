                    let text = translations[lang];
                    keys.forEach(k => text = text[k]);

                        el.placeholder = text;
                    } else {
                        el.textContent = text;
                    }

                    const username = e.target.username.value;
                    const password = e.target.password.value;
                    const loginMessage = document.getElementById('loginMessage');

                    let userRole = null;

                });

            /* -------------------------
               QR Scanner (camera)
               ------------------------- */
            const setupQrScanner = () => {
                const video = document.getElementById('qr-scanner');
                const startScanBtn = document.getElementById('startScanBtn');
                const scanStatus = document.getElementById('scanStatus');
                const inspectionDetails = document.getElementById('inspectionDetails');
                const itemDetailsOutput = document.getElementById('itemDetailsOutput');

                let scanInterval;

                const startScanning = () => {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                        .then(function(stream) {
                            currentStream = stream;
                            video.srcObject = stream;
                            video.setAttribute("playsinline", true);
                            video.play();
                            scanStatus.textContent = translations[currentLang]['inspector_dashboard']['scan_status'];
                            scanStatus.classList.add('text-red-500');
                            scanStatus.classList.remove('text-green-500');
                            startScanBtn.textContent = translations[currentLang]['inspector_dashboard']['stop_scan_btn'];
                            startScanBtn.classList.remove('bg-blue-600');
                            startScanBtn.classList.add('bg-red-600');

                            scanInterval = setInterval(tick, 100);
                        })
                        .catch(function(err) {
                            console.error("Error accessing camera: ", err);
                            scanStatus.textContent = "Error: Camera access denied or not available.";
                            scanStatus.classList.remove('text-red-500');
                        });
                };

                const stopScanning = () => {
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    if (scanInterval) {
                        clearInterval(scanInterval);
                        scanInterval = null;
                    }
                    startScanBtn.textContent = translations[currentLang]['inspector_dashboard']['start_scan_btn'];
                    startScanBtn.classList.remove('bg-red-600');
                    startScanBtn.classList.add('bg-blue-600');
                };

                startScanBtn.addEventListener('click', () => {
                    if (currentStream) {
                        stopScanning();
                        scanStatus.textContent = translations[currentLang]['inspector_dashboard']['scan_status'];
                        scanStatus.classList.add('text-red-500');
                        scanStatus.classList.remove('text-green-500');
                        inspectionDetails.classList.add('hidden');
                        itemDetailsOutput.innerHTML = `<p class="text-gray-600" data-lang-key="inspector_dashboard.item_details_placeholder">Scan an item to see its details here.</p>`;
                        updateUI(currentLang);
                    } else {
                        startScanning();
                    }
                });

                function tick() {
                    const canvasElement = document.getElementById("qr-canvas");
                    const canvas = canvasElement.getContext("2d");
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvasElement.hidden = false;
                        canvasElement.height = video.videoHeight;
                        canvasElement.width = video.videoWidth;
                        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "dontInvert",
                        });
                        if (code) {
                            stopScanning();
                            scanStatus.textContent = translations[currentLang]['inspector_dashboard']['scan_success'];
                            scanStatus.classList.remove('text-red-500');
                            scanStatus.classList.add('text-green-500');

                            try {
                                const qrData = JSON.parse(code.data);
                                displayItemDetails(qrData);
                                if (document.getElementById("inspectionDate")) {
                                    document.getElementById("inspectionDate").value = new Date().toISOString().slice(0, 10);
                                }
                                if (inspectionDetails) inspectionDetails.classList.remove("hidden");
                                scanStatus.textContent = "QR Code successfully scanned!";
                                } catch (e) {
                                displayItemDetails(code.data); // fallback plain text
                                if (inspectionDetails) inspectionDetails.classList.remove("hidden");
                                scanStatus.textContent = "Scanned plain text QR: " + code.data;
                            }

                        }
                    }
                }
            };

            /* -------------------------
               QR Image Upload (fixed)
               ------------------------- */
            const setupQrUpload = () => {
                const uploadInput = document.getElementById('qrImageUpload');
                if (!uploadInput) return;
                uploadInput.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, imageData.width, imageData.height);
                            if (code) {
                                try {
                                    const qrData = JSON.parse(code.data);   // parse JSON QR
                                    displayItemDetails(qrData);
                                    document.getElementById('scanStatus').textContent = 'QR Code successfully decoded from image!';
                                } catch (err) {
                                    // fallback: plain text
                                    displayItemDetails(code.data);
                                    document.getElementById('scanStatus').textContent = 'Decoded plain text QR: ' + code.data;
                                }
                            } else {
                                document.getElementById('scanStatus').textContent = 'No QR code found in image.';
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            /* -------------------------
               Display Item Details (fixed)
               Handles JSON objects and plain text
               ------------------------- */
            const displayItemDetails = (data) => {
                const outputDiv = document.getElementById("itemDetailsOutput");
                if (!outputDiv) return; // prevent crash if element not ready

                if (typeof data === "string") {
                    outputDiv.innerHTML = `<p><strong>QR Data:</strong> ${data}</p>`;
                    return;
                }

                // JSON object QR
                outputDiv.innerHTML = `
                    <p><strong>Item ID:</strong> ${data.itemId || ''}</p>
                    <p><strong>Manufacturing Name:</strong> ${data.manufacturingName || ''}</p>
                    <p><strong>Vendor Lot Number:</strong> ${data.vendorLotNumber || ''}</p>
                    <p><strong>Date of Supply:</strong> ${data.dateOfSupply || ''}</p>
                    <p><strong>Warranty Period:</strong> ${data.warrantyPeriod || ''}</p>
                    <p><strong>Location:</strong> ${data.location || ''}</p>
                    <p><strong>Timestamp:</strong> ${data.timestamp || ''}</p>
                `;
            };


            /* small helper to avoid injecting HTML if QR contains markup */
            function escapeHtml(unsafe) {
                return String(unsafe)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
            }

            /* -------------------------
               Inspector: capture photo & generate PDF
               ------------------------- */
            const setupInspectorDashboard = () => {
                const capturePhotoBtn = document.getElementById('capturePhotoBtn');
                const photoCanvas = document.getElementById('photo-canvas');
                const inspectionPhoto = document.getElementById('inspection-photo');
                const downloadPdfBtn = document.getElementById('downloadPdfBtn');
                let photoDataUrl = null;

                if (capturePhotoBtn) {
                    capturePhotoBtn.addEventListener('click', async () => {
                        const video = document.getElementById('qr-scanner');
                        if (!video || !video.srcObject) {
                            alert("Please start the QR scanner first to capture a photo.");
                            return;
                        }
                        const canvasContext = photoCanvas.getContext('2d');
                        photoCanvas.width = video.videoWidth;
                        photoCanvas.height = video.videoHeight;
                        canvasContext.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);

                        const now = new Date();
                        const timestampText = now.toLocaleString();
                        canvasContext.font = '24px Arial';
                        canvasContext.fillStyle = 'red';
                        canvasContext.fillText(timestampText, 10, 30);

                        photoDataUrl = photoCanvas.toDataURL('image/png');
                        inspectionPhoto.src = photoDataUrl;
                        inspectionPhoto.classList.remove('hidden');
                        inspectionPhoto.style.display = 'block';
                        alert(translations[currentLang]['inspector_dashboard']['photo_captured']);
                    });
                }

                if (downloadPdfBtn) {
                    downloadPdfBtn.addEventListener('click', () => {
                        if (!photoDataUrl) {
                            alert("Please capture a photo first.");
                            return;
                        }

                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const itemDetailsOutput = document.getElementById('itemDetailsOutput').innerText;
                        const inspectionDate = document.getElementById('inspectionDate').value || new Date().toISOString().slice(0,10);
                        const inspectorName = 'Inspector J. Doe';

                        doc.setFontSize(22);
                        doc.text(translations[currentLang]['inspector_dashboard']['title'], 105, 20, null, null, "center");
                        doc.setFontSize(16);
                        doc.text('Inspection Report', 105, 30, null, null, "center");

                        doc.setFontSize(12);
                        doc.text(`Report Date: ${new Date().toISOString().slice(0, 10)}`, 15, 40);
                        doc.text(`Inspector: ${inspectorName}`, 15, 47);

                        doc.setFontSize(14);
                        doc.text('Item Details:', 15, 60);
                        doc.setFontSize(12);
                        const itemDetailsLines = itemDetailsOutput.split('\n').filter(line => line.trim() !== '');
                        let yPos = 65;
                        itemDetailsLines.forEach(line => {
                            doc.text(line, 15, yPos);
                            yPos += 7;
                        });

                        doc.setFontSize(14);
                        doc.text('Inspection Details:', 15, yPos + 10);
                        doc.setFontSize(12);
                        doc.text(`Inspection Date: ${inspectionDate}`, 15, yPos + 17);

                        if (photoDataUrl) {
                            const img = new Image();
                            img.onload = () => {
                                const imgWidth = 100;
                                const imgHeight = (img.height * imgWidth) / img.width;
                                doc.addImage(photoDataUrl, 'PNG', 15, yPos + 25, imgWidth, imgHeight);
                                doc.save('Inspection_Report.pdf');
                                alert(translations[currentLang]['inspector_dashboard']['pdf_generated']);
                            };
                            img.src = photoDataUrl;
                        } else {
                            doc.save('Inspection_Report.pdf');
                            alert(translations[currentLang]['inspector_dashboard']['pdf_generated']);
                        }
                    });
                }
            };

            /* -------------------------
               QR Generator (manufacturer)
               ------------------------- */
            const setupQrGenerator = () => {
                const qrForm = document.getElementById('qrForm');
                const qrCodeContainer = document.getElementById('qrCodeContainer');
                const qrButtons = document.getElementById('qrButtons');

                const generateQRCode = (data) => {
                    qrCodeContainer.innerHTML = '';
                    new QRCode(qrCodeContainer, {
                        text: data,
                        width: 256,
                        height: 256,
                    });
                    qrButtons.classList.remove('hidden');
                };

                if (qrForm) {
                    qrForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const formData = new FormData(qrForm);
                        const data = Object.fromEntries(formData.entries());
                        const qrData = JSON.stringify(data);
                        generateQRCode(qrData);
                    });
                }

                const downloadBtn = document.getElementById('downloadButton');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', () => {
                        const qrCodeCanvas = qrCodeContainer.querySelector('canvas');
                        if (!qrCodeCanvas) return;
                        const link = document.createElement('a');
                        link.href = qrCodeCanvas.toDataURL('image/png');
                        link.download = 'qrcode.png';
                        link.click();
                    });
                }

                const resetBtn = document.getElementById('resetButton');
                if (resetBtn) {
                    resetBtn.addEventListener('click', () => {
                        qrForm.reset();
                        qrCodeContainer.innerHTML = '';
                        qrButtons.classList.add('hidden');
                    });
                }
            };

            /* -------------------------
               Analytics charts
               ------------------------- */
            const setupAnalyticsDashboard = () => {
                const renderChart = (chartId, type, data, options) => {
                    const ctx = document.getElementById(chartId).getContext('2d');
                    if (myCharts[chartId]) {
                        myCharts[chartId].destroy();
                    }
                    myCharts[chartId] = new Chart(ctx, { type, data, options });
                };

                renderChart('vendorDefectChart', 'bar', {
                    labels: analyticsData.vendorDefect.labels,
                    datasets: [{
                        label: 'Defect Rate (%)',
                        data: analyticsData.vendorDefect.data,
                        backgroundColor: 'rgba(239, 68, 68, 0.6)',
                        borderColor: 'rgba(239, 68, 68, 1)',
                        borderWidth: 1
                    }]
                }, {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                });

                renderChart('warrantyChart', 'doughnut', {
                    labels: analyticsData.warranty.labels,
                    datasets: [{
                        label: 'Warranty Status',
                        data: analyticsData.warranty.data,
                        backgroundColor: ['rgb(75, 192, 192)', 'rgb(255, 99, 132)', 'rgb(201, 203, 207)'],
                        hoverOffset: 4
                    }]
                }, { responsive: true });

                renderChart('predictionChart', 'line', {
                    labels: analyticsData.prediction.labels,
                    datasets: [{
                        label: 'Predicted Failures',
                        data: analyticsData.prediction.data,
                        borderColor: 'rgb(54, 162, 235)',
                        tension: 0.1
                    }]
                }, { responsive: true, scales: { y: { beginAtZero: true } } });

                renderChart('inspectionTrendsChart', 'line', {
                    labels: analyticsData.inspectionTrends.labels,
                    datasets: [
                        {
                            label: translations[currentLang]['analytics']['chart_pass'],
                            data: analyticsData.inspectionTrends.pass,
                            borderColor: 'rgb(75, 192, 192)',
                            tension: 0.1
                        },
                        {
                            label: translations[currentLang]['analytics']['chart_fail'],
                            data: analyticsData.inspectionTrends.fail,
                            borderColor: 'rgb(255, 99, 132)',
                            tension: 0.1
                        }
                    ]
                }, { responsive: true, scales: { y: { beginAtZero: true } } });
            };

            /* -------------------------
               Initial render + events
               ------------------------- */
            renderPage('login');

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const pageName = e.currentTarget.id.replace('Link', '');
                    renderPage(pageName);
                });
            });

            languageSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('lang', currentLang);
                updateUI(currentLang);
                const currentPage = document.querySelector('.sidebar a.active').id.replace('Link', '');
                renderPage(currentPage);
            });
        });
    </script>
</body>
</html>
